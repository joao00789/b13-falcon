name: B13 FALCON APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Enable KVM group permissions
        run: echo 'KVM is available in the runner'

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format check
        run: dart format --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Check APK artifact
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: b13-falcon-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Provide APK download location
        run: echo "APK disponível no caminho build/app/outputs/flutter-apk/app-debug.apk"
