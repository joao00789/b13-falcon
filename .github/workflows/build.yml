name: B13 FALCON APK Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v4

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format check
        run: dart format --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.B13_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/b13-falcon-release.p12"
          chmod 600 "$RUNNER_TEMP/b13-falcon-release.p12"
          echo "B13_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/b13-falcon-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          B13_RELEASE_STORE_PASSWORD: ${{ secrets.B13_RELEASE_STORE_PASSWORD }}
          B13_RELEASE_KEY_ALIAS: ${{ secrets.B13_RELEASE_KEY_ALIAS }}
          B13_RELEASE_KEY_PASSWORD: ${{ secrets.B13_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$B13_RELEASE_STORE_PASSWORD"
          test -n "$B13_RELEASE_KEY_ALIAS"
          test -n "$B13_RELEASE_KEY_PASSWORD"
          flutter build apk --release --split-per-abi

      - name: Check APK artifact
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: b13-falcon-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: b13-falcon-release-apks
          path: release-apk

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "B13 FALCON $GITHUB_REF_NAME" \
            --notes "APKs release assinados do B13 FALCON, gerados pelo GitHub Actions para teste." \
            --prerelease
